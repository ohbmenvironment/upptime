# Change these first
owner: ohbmenvironment # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Mattermost
    url: https://mattermost.ohbm-environment.org

assignees: # Users to assign downtime issues (optional)
  - michellewang
  - nikhil153

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.ohbm-environment.org
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: SEA-SIG Upptime
  introTitle: "SEA-SIG uptime monitor and status page."
  introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/ohbmenvironment/upptime).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
